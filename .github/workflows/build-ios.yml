name: Build FloatCam Pro iOS (IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build & Archive iOS App
        run: |
          xcodebuild -project FloatCamPro.xcodeproj \
            -scheme FloatCamPro \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/FloatCamPro.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/FloatCamPro.xcarchive/Products/Applications/FloatCamPro.app build/Payload/
          cd build
          zip -qr FloatCamPro.ipa Payload
          ls -lh FloatCamPro.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatCamPro-iOS-IPA
          path: build/FloatCamPro.ipa
          retention-days: 14

      - name: Create Direct GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.3-build.${{ github.run_number }}"
          gh release create "$TAG_NAME" build/FloatCamPro.ipa \
            --title "FloatCam Pro iOS ($TAG_NAME)" \
            --notes "Direct 1-click download of FloatCamPro.ipa for Sideloadly / AltStore. Includes Camera & PhotoKit crash fixes and ultra-sleek Obsidian Studio UI." \
            --latest
