name: Build FloatCam Pro iOS (IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build & Archive iOS App
        run: |
          xcodebuild -project FloatCamPro.xcodeproj \
            -scheme FloatCamPro \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/FloatCamPro.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package Unsigned IPA with Injected Privacy Descriptions & Multitasking Capabilities
        run: |
          mkdir -p build/Payload
          cp -R build/FloatCamPro.xcarchive/Products/Applications/FloatCamPro.app build/Payload/
          PLIST="build/Payload/FloatCamPro.app/Info.plist"

          echo "Configuring privacy usage descriptions in $PLIST..."
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription 'FloatCam Pro requires camera access to preview and capture photos and video in floating overlay and Picture-in-Picture mode.'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'FloatCam Pro requires camera access to preview and capture photos and video in floating overlay and Picture-in-Picture mode.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription 'FloatCam Pro requires microphone access to record clear audio during floating camera recordings.'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'FloatCam Pro requires microphone access to record clear audio during floating camera recordings.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription 'FloatCam Pro requires access to your photo library to save and display captured photos and videos.'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'FloatCam Pro requires access to your photo library to save and display captured photos and videos.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryAddUsageDescription 'FloatCam Pro requires permission to save photos and video captures to your camera roll.'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string 'FloatCam Pro requires permission to save photos and video captures to your camera roll.'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'FloatCam Pro'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'FloatCam Pro'" "$PLIST"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString '1.0.7'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string '1.0.7'" "$PLIST"

          # Ensure UIBackgroundModes contains audio and voip
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string voip" "$PLIST" || true

          echo "=== Verified Info.plist in FloatCamPro.app ==="
          plutil -p "$PLIST"

          cd build
          zip -qr FloatCamPro.ipa Payload
          ls -lh FloatCamPro.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatCamPro-iOS-IPA
          path: build/FloatCamPro.ipa
          retention-days: 14

      - name: Create Direct GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.7-build.${{ github.run_number }}"
          gh release create "$TAG_NAME" build/FloatCamPro.ipa \
            --title "FloatCam Pro iOS ($TAG_NAME)" \
            --notes "FloatCam Pro iOS v1.0.7 with persistent multitasking camera access and live Picture-in-Picture floating over Gemini AI, Meta AI & all apps." \
            --latest
